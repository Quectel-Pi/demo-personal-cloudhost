# 个人云主机 SSH 加固（设计文档 F4 / 11.1 / A3）
# 由 install.sh 安装到 /etc/ssh/sshd_config.d/90-cloudhost.conf
# 校验：ssh -T 输出拒绝 password，sshd -T | grep passwordauthentication 为 no

# 只允许密钥登录
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitEmptyPasswords no

# 禁止 root 直接登录
PermitRootLogin no

# 限制重试次数与认证尝试
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 30

# 保留已存在的 authorized_keys 校验方式
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
